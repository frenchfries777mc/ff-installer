name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: sh scripts/build.sh
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" setup.exe --title "$GITHUB_REF_NAME" --notes "Windows installer for Frenchfries777 web apps. Rename to <app-id>-setup.exe (for example stickseum-setup.exe) before running. See README."
