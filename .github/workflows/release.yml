name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v1.0.0)'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: sh scripts/build.sh
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag }}" setup.exe --target "$GITHUB_SHA" --title "${{ inputs.tag }}" --notes "Windows installer for Frenchfries777 web apps. Rename to <app-id>-setup.exe (for example stickseum-setup.exe) before running. See README."
