name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go vet ./...
        env:
          GOOS: windows
      - run: sh scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: setup-unsigned
          path: setup.exe
